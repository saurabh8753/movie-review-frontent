<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Review</title>
<style>
  body { background:#0f0f0f; color:#fff; font-family:sans-serif; margin:0; padding:20px; }
  h1 { font-size:22px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; margin-top:16px; }
  .card { background:#181818; border-radius:8px; overflow:hidden; cursor:pointer; }
  .card .thumb-wrap { position:relative; }
  .card img { width:100%; display:block; }
  .play-icon {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:50px; height:50px; background:rgba(0,120,255,0.9); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .card h3 { font-size:14px; padding:8px; margin:0; }
  .card a { color:inherit; text-decoration:none; }
  .ad-slot { grid-column:1/-1; text-align:center; padding:16px; background:#181818; border-radius:8px; }
  .load-more { display:block; margin:20px auto; padding:10px 24px; background:#0078ff; color:#fff; border:0; border-radius:4px; cursor:pointer; }
</style>
</head>
<body>
<!--
  EASY TITLE CHANGE: just edit SITE_TITLE below — it updates both the
  <h1> on the page and the browser tab title automatically.
-->
<h1 id="siteTitle"></h1>

<div class="grid" id="grid"></div>
<button class="load-more" id="loadMore">Load More</button>

<script>
const SITE_TITLE = "📱 Tech & Gadget Reviews"; // ← change site name here only
document.title = SITE_TITLE;
document.getElementById("siteTitle").textContent = SITE_TITLE;

const API = "https://movie-review-worker.jaanewale6.workers.dev";
let page = 1;

function cardHTML(v) {
  return `
    <div class="card">
      <a href="/video/${v.video_id}">
        <div class="thumb-wrap">
          <img src="${v.thumbnail}" loading="lazy" alt="${v.title}">
          <div class="play-icon">▶</div>
        </div>
        <h3>${v.title}</h3>
      </a>
    </div>`;
}

async function loadVideos() {
  const url = `${API}/videos?page=${page}`;
  const res = await fetch(url);
  const data = await res.json();

  const grid = document.getElementById("grid");
  const html = data.map(cardHTML).join("");

  grid.insertAdjacentHTML("beforeend", html);
  if (data.length > 0 && page === 1) {
    grid.insertAdjacentHTML("beforeend", `<div class="ad-slot">Ad Space</div>`);
  }
  page++;
}

document.getElementById("loadMore").addEventListener("click", loadVideos);

loadVideos();
</script>
</body>
</html>
